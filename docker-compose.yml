services:
  timestral:
    build: .
    container_name: timestral-api
    ports:
      - "8000:8000"
    environment:
      MODEL_ID: mistralai/Timestral-28M
      HF_HOME: /models
      DEVICE: cpu
    volumes:
      - ./models:/models
      - ./data:/data
      - ./output:/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped